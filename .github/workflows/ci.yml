name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6'
      - name: SWI-Prolog for the mnns bridge tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq swi-prolog-nox
      - name: Build and test (Build.hs)
        run: runghc Build.hs ci
